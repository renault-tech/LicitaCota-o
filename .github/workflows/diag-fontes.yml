name: diag-fontes

on:
  workflow_dispatch:

jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Swagger completo (todas as rotas e parametros)
        run: |
          curl -sS -m 40 https://dadosabertos.compras.gov.br/v3/api-docs -o docs.json
          python3 - <<'EOF'
          import json
          d = json.load(open('docs.json'))
          for p, ops in d.get('paths', {}).items():
              if '_CSV' in p: continue
              for m, op in ops.items():
                  params = [x.get('name') + ('*' if x.get('required') else '') for x in op.get('parameters', [])]
                  print(p, ' '.join(params))
          EOF
      - name: Testes de preco
        run: |
          B=https://dadosabertos.compras.gov.br
          show() { echo "=================== $1"; curl -sS -m 40 -w '\nHTTP %{http_code} em %{time_total}s\n' "$B/$1" > out.txt || true; python3 - <<'EOF'
          import json
          raw = open('out.txt').read()
          body, _, tail = raw.rpartition('\n{') if False else (raw, '', '')
          try:
              j = json.loads(raw[:raw.rfind('\nHTTP')])
          except Exception:
              print(raw[:600]); raise SystemExit
          res = j.get('resultado') if isinstance(j, dict) else j
          print('chaves:', list(j.keys()) if isinstance(j, dict) else 'lista', '| totalRegistros:', j.get('totalRegistros') if isinstance(j, dict) else None, '| n:', len(res or []))
          for r in (res or [])[:4]:
              print('  ', {k: r.get(k) for k in ('codigoItemCatalogo','codigoItem','codigoPdm','precoUnitario','valorUnitarioHomologado','descricaoItem','nomeOrgao','estado','dataResultado','dataCompra','codigoServico','nomePdm')})
          print(raw[raw.rfind('\nHTTP'):].strip())
          EOF
          }
          show "modulo-pesquisa-preco/1_consultarMaterial?pagina=1&tamanhoPagina=10&tipo=codigoItemCatalogo&codigo=443990&estado=MG"
          show "modulo-pesquisa-preco/1_consultarMaterial?pagina=1&tamanhoPagina=10&tipo=codigoPdm&codigo=5080"
          show "modulo-pesquisa-preco/1_consultarMaterial?pagina=1&tamanhoPagina=10&tipo=codigoPdm&codigo=5080&estado=SP"
          show "modulo-material/4_consultarItemMaterial?pagina=1&tamanhoPagina=10&descricaoItem=caneta%20esferografica"
          show "modulo-material/3_consultarPdmMaterial?pagina=1&tamanhoPagina=10&nomePdm=caneta"
          show "modulo-servico/6_consultarItemServico?pagina=1&tamanhoPagina=10&descricaoServico=limpeza"
          show "modulo-pesquisa-preco/3_consultarServico?pagina=1&tamanhoPagina=10&codigoItemCatalogo=24325"
