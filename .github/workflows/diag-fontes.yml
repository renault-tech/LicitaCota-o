name: diag-fontes

on:
  workflow_dispatch:

jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Swagger completo (todas as rotas e parametros)
        run: |
          curl -sS -m 40 https://dadosabertos.compras.gov.br/v3/api-docs -o docs.json
          python3 - <<'EOF'
          import json
          d = json.load(open('docs.json'))
          for p, ops in d.get('paths', {}).items():
              if '_CSV' in p: continue
              for m, op in ops.items():
                  params = [x.get('name') + ('*' if x.get('required') else '') for x in op.get('parameters', [])]
                  print(p, ' '.join(params))
          EOF
      - name: Testes PNCP via Compras e ARP
        run: |
          B=https://dadosabertos.compras.gov.br
          D1=$(date -d '-365 days' +%Y-%m-%d); D2=$(date +%Y-%m-%d)
          show() { echo "=================== $1"; curl -sS -m 60 -w '\nHTTP %{http_code} em %{time_total}s\n' "$B/$1" > out.txt || true; python3 - <<'PY'
          import json
          raw = open('out.txt').read()
          try:
              j = json.loads(raw[:raw.rfind('\nHTTP')])
          except Exception:
              print(raw[:800]); raise SystemExit
          res = j.get('resultado') if isinstance(j, dict) else j
          print('chaves:', list(j.keys()) if isinstance(j, dict) else 'lista', '| total:', j.get('totalRegistros') if isinstance(j, dict) else None, '| n:', len(res or []))
          for r in (res or [])[:2]:
              print(json.dumps(r, ensure_ascii=False)[:1800])
          print(raw[raw.rfind('\nHTTP'):].strip())
          PY
          }
          show "modulo-contratacoes/2_consultarItensContratacoes_PNCP_14133?pagina=1&tamanhoPagina=10&codItemCatalogo=443990&dataInclusaoPncpInicial=$D1&dataInclusaoPncpFinal=$D2"
          show "modulo-contratacoes/2_consultarItensContratacoes_PNCP_14133?pagina=1&tamanhoPagina=10&codigoPdm=5080&temResultado=true&dataInclusaoPncpInicial=$D1&dataInclusaoPncpFinal=$D2"
          show "modulo-arp/2_consultarARPItem?pagina=1&tamanhoPagina=10&codigoItem=443990&dataVigenciaInicialMin=$D1&dataVigenciaInicialMax=$D2"
          show "modulo-arp/2_consultarARPItem?pagina=1&tamanhoPagina=10&codigoPdm=5080&dataVigenciaInicialMin=$D1&dataVigenciaInicialMax=$D2"
          show "modulo-pesquisa-preco/1_consultarMaterial?pagina=1&tamanhoPagina=10&tipo=codigoPdm&codigo=5080&dataCompraInicio=$D1"
